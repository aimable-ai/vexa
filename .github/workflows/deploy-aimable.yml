# deploy-aimable — Aimable's own deploy of the 0.12 stack on vexa.aimable.ai (AIM-2231).
#
# Builds the images Aimable changes (meeting-api, bot) and pushes them to GHCR as sha-<short>
# plus the moving :deploy tag. Nothing connects to the box: there, deploy/aimable/pull-deploy.sh
# (cron, every minute) pulls :deploy and applies it once no meeting is live or about to start.
#
# Runs on every push to the deployed branch that touches an image's own code (the `changes` job
# picks which), or by hand. A change elsewhere in core/ that the bot also copies needs a manual run.
#
# Not the upstream release chain (release-images.yml publishes vexaai/* to Docker Hub).

name: Deploy Aimable (vexa 0.12)

on:
  push:
    branches: [aim-1467-vexa-012-port]
    paths:
      - core/meetings/services/meeting-api/**
      - core/meetings/contracts/**
      - core/runtime/contracts/**
      - core/meetings/services/bot/**
      - core/meetings/modules/**
  workflow_dispatch:
    inputs:
      services:
        description: What to deploy
        required: true
        default: meeting-api
        type: choice
        options: [meeting-api, bot, meeting-api+bot]

env:
  REGISTRY: ghcr.io/aimable-ai

concurrency:
  group: deploy-vexa-012
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      meeting_api: ${{ steps.pick.outputs.meeting_api }}
      bot: ${{ steps.pick.outputs.bot }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          SERVICES: ${{ inputs.services }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            case "$SERVICES" in *meeting-api*) echo "meeting_api=true" >> "$GITHUB_OUTPUT";; esac
            case "$SERVICES" in *bot*) echo "bot=true" >> "$GITHUB_OUTPUT";; esac
            exit 0
          fi
          # unknown base (force push): deploy nothing, run it by hand
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null) || changed=""
          if echo "$changed" | grep -qE '^core/(meetings/(services/meeting-api|contracts)|runtime/contracts)/'; then
            echo "meeting_api=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^core/meetings/(services/bot|modules)/'; then
            echo "bot=true" >> "$GITHUB_OUTPUT"
          fi

  meeting-api:
    needs: changes
    # :deploy goes to production, so only from the deployed branch.
    if: needs.changes.outputs.meeting_api == 'true' && github.ref == 'refs/heads/aim-1467-vexa-012-port'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: tag
        run: echo "tag=sha-$(git rev-parse --short=9 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: core/meetings/services/meeting-api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/vexa-v012-meeting-api:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/vexa-v012-meeting-api:deploy
          labels: |
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=meeting-api
          cache-to: type=gha,scope=meeting-api,mode=max
      - run: echo "Pushed meeting-api ${{ steps.tag.outputs.tag }} (+ :deploy); the box applies it once no meeting is live (~/aimable-deploy/deploy.log)." >> "$GITHUB_STEP_SUMMARY"

  # Own job without buildx: the bot builds FROM the local vexa/meet-join-env:dev base, which only
  # the classic docker driver can see (same as release-images.yml).
  bot:
    needs: changes
    if: needs.changes.outputs.bot == 'true' && github.ref == 'refs/heads/aim-1467-vexa-012-port'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1, before any credential exists
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          REPO: ${{ env.REGISTRY }}/vexa-v012-bot
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="sha-$(git rev-parse --short=9 HEAD)"
          docker pull -q "$REPO:deploy" || true   # inline cache from the previous deploy
          DOCKER_BUILDKIT=1 docker build -f core/meetings/modules/join/Dockerfile.env \
            -t vexa/meet-join-env:dev core/meetings/modules/join
          DOCKER_BUILDKIT=1 docker build -f core/meetings/services/bot/Dockerfile \
            --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from "$REPO:deploy" \
            --build-arg "VEXA_IMAGE_VERSION=$TAG" \
            --label "org.opencontainers.image.version=$TAG" \
            --label "org.opencontainers.image.source=$SOURCE" \
            -t "$REPO:$TAG" -t "$REPO:deploy" .
          docker push "$REPO:$TAG"
          docker push "$REPO:deploy"
          echo "Pushed bot $TAG (+ :deploy); the box applies it once no meeting is live (~/aimable-deploy/deploy.log)." >> "$GITHUB_STEP_SUMMARY"
