# deploy-aimable — Aimable's own deploy of the 0.12 stack on vexa.aimable.ai (AIM-2231).
#
# Builds the images Aimable changes (meeting-api, bot) and pushes them to GHCR as sha-<short>
# plus the moving :deploy tag. Nothing connects to the box: there, deploy/aimable/pull-deploy.sh
# (cron, every minute) pulls :deploy and applies it once no meeting is live.
#
# Not the upstream release chain (release-images.yml publishes vexaai/* to Docker Hub).

name: Deploy Aimable (vexa 0.12)

on:
  workflow_dispatch:
    inputs:
      services:
        description: What to deploy
        required: true
        default: meeting-api
        type: choice
        options: [meeting-api, bot, meeting-api+bot]

env:
  REGISTRY: ghcr.io/aimable-ai

concurrency:
  group: deploy-vexa-012
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-$(git rev-parse --short=9 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: contains(inputs.services, 'meeting-api')
        uses: docker/setup-buildx-action@v3
      - if: contains(inputs.services, 'meeting-api')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core/meetings/services/meeting-api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/vexa-v012-meeting-api:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/vexa-v012-meeting-api:deploy
          labels: |
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=meeting-api
          cache-to: type=gha,scope=meeting-api,mode=max

      # The bot builds FROM the local vexa/meet-join-env:dev base, which only the classic docker
      # driver can see (same as release-images.yml).
      - if: contains(inputs.services, 'bot')
        uses: jlumbroso/free-disk-space@v1.3.1
      - if: contains(inputs.services, 'bot')
        env:
          REPO: ${{ env.REGISTRY }}/vexa-v012-bot
          TAG: ${{ steps.tag.outputs.tag }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build -f core/meetings/modules/join/Dockerfile.env \
            -t vexa/meet-join-env:dev core/meetings/modules/join
          DOCKER_BUILDKIT=1 docker build -f core/meetings/services/bot/Dockerfile \
            --build-arg "VEXA_IMAGE_VERSION=$TAG" \
            --label "org.opencontainers.image.version=$TAG" \
            --label "org.opencontainers.image.source=$SOURCE" \
            -t "$REPO:$TAG" -t "$REPO:deploy" .
          docker push "$REPO:$TAG"
          docker push "$REPO:deploy"

      - name: Summary
        env:
          SERVICES: ${{ inputs.services }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "Pushed $SERVICES as $TAG (+ :deploy)."
            echo "The box applies it within a minute once no meeting is live (~/aimable-deploy/deploy.log)."
          } >> "$GITHUB_STEP_SUMMARY"
